<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Finance Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0ef;
        }
        .navbar {
            background-color: #4a4a4a !important;
        }
        .btn-primary {
            background-color: #6699cc;
            border-color: #6699cc;
        }
        .btn-primary:hover {
            background-color: #5588bb;
            border-color: #5588bb;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-dark">
            <div class="container">
                <span class="navbar-brand mb-0" >Finance Tracker</span>

                <div class="d-flex gap-2">
                    <a href="{% url 'rango:home' %}" class="btn btn-outline-light btn-sm">Home</a>

                    {% if user.is_authenticated %}
                        <form method="post" action="{% url 'rango:logout' %}" class="d-flex">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>
    
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
