{% extends 'rango/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row row-cols-1 row-cols-md-2 g-3 mb-3">
        {% for account in accounts %}
            <div class="col">
                <a href="{% url 'rango:account_page' account.id %}" class="text-decoration-none text-dark">
                    <div class="card shadow-sm">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">{{ account }}</h5>
                            <span class="fs-5">£{{ account.balance }}</span>
                        </div>
                    </div>
                </a>
            </div>
        {% endfor %}
    </div>

    <a href="{% url 'rango:create_account' %} " class="btn btn-primary mb-3"> Create Account</a>

</div>
{% endblock %}
