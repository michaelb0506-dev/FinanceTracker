<h1>Finance Tracker</h1>

{% for account in accounts %}
    <p> {{account}} --- {{account.balance}}</p>
{% endfor %}

<a href="{% url 'rango:create_account' %}"> Create Account</a>

<form method="post" action="{% url 'rango:logout' %}">
    {% csrf_token %}
    <button type="submit"> Logout </button>
</form>
